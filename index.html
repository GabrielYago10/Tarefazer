<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarefazer</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="hero">

        <div class="hero-chart" id="heroChart"></div>

        <header>

            <div class="logo">

                <h1>Tarefazer</h1>

                <p>Organize seu fluxo, conclua mais.</p>

            </div>

            <div class="acoes-header">

                <button id="btnPersonalizar" type="button" class="btn-personalizar" aria-haspopup="true" aria-expanded="false">
                    ⚙️ Personalizar
                </button>

                <button id="novaTarefa">
                    + Nova tarefa
                </button>

                <div id="painelPersonalizar" class="painel-personalizar">

                    <div class="painel-cabecalho">
                        <h3>Personalizar</h3>
                    </div>

                    <div class="grupo-personalizar">

                        <span class="rotulo-personalizar">Tema</span>

                        <div class="opcoes-tema">

                            <button type="button" class="opcao-tema ativo" data-tema="escuro">Escuro</button>
                            <button type="button" class="opcao-tema" data-tema="claro">Claro</button>

                        </div>

                    </div>

                    <div class="grupo-personalizar">

                        <span class="rotulo-personalizar">Cor principal</span>

                        <div class="opcoes-cor">

                            <button type="button" class="opcao-cor ativo" data-cor="roxo" title="Roxo"></button>
                            <button type="button" class="opcao-cor" data-cor="azul" title="Azul"></button>
                            <button type="button" class="opcao-cor" data-cor="verde" title="Verde"></button>
                            <button type="button" class="opcao-cor" data-cor="rosa" title="Rosa"></button>
                            <button type="button" class="opcao-cor" data-cor="laranja" title="Laranja"></button>

                        </div>

                    </div>

                    <button type="button" id="btnFecharPersonalizar" class="btn-fechar-personalizar">Fechar</button>

                </div>

            </div>

        </header>

        <section class="barra-pesquisa">

            <input type="text" id="pesquisa" placeholder=" Pesquisar tarefas...">

        </section>


        <section class="dashboard">

            <div class="card-dashboard">
                <h3>Total</h3>
                <span id="totalTarefas">0</span>
            </div>

            <div class="card-dashboard">
                <h3>A Fazer</h3>
                <span id="todoCount">0</span>
            </div>

            <div class="card-dashboard">
                <h3>Fazendo</h3>
                <span id="doingCount">0</span>
            </div>

            <div class="card-dashboard">
                <h3>Revisão</h3>
                <span id="reviewCount">0</span>
            </div>

            <div class="card-dashboard">
                <h3>Concluído</h3>
                <span id="doneCount">0</span>
            </div>

        </section>

    </div>





    <main class="kanban">

        <section class="coluna" data-coluna="todo">

            <div class="titulo-coluna">
                <h2>A Fazer</h2>
                <span>0</span>
            </div>

            <div class="cards" id="todo"></div>

        </section>

        <section class="coluna" data-coluna="doing">

            <div class="titulo-coluna">
                <h2>Fazendo</h2>
                <span>0</span>
            </div>

            <div class="cards" id="doing"></div>

        </section>

        <section class="coluna" data-coluna="review">

            <div class="titulo-coluna">
                <h2>Revisão</h2>
                <span>0</span>
            </div>

            <div class="cards" id="review"></div>

        </section>

        <section class="coluna" data-coluna="done">

            <div class="titulo-coluna">
                <h2>Concluído</h2>
                <span>0</span>
            </div>

            <div class="cards" id="done"></div>

        </section>

    </main>

    <div class="modal-overlay hidden">

        <div class="modal">

            <h2>Nova tarefa</h2>

            <form id="formTarefa">

                <label>Título</label>

                <input id="titulo" type="text" placeholder="Ex: Criar tela de login" required>

                <label>Descrição</label>

                <textarea id="descricao" rows="4" placeholder="Descreva a tarefa..." required></textarea>

                <label>Prioridade</label>

                <select id="propriedade">

                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>

                </select>

                <label>Data de vencimento</label>

                <input type="date" id="dataVencimento">

                <label>Coluna</label>

                <select id="coluna">

                    <option value="todo">A Fazer</option>
                    <option value="doing">Fazendo</option>
                    <option value="review">Revisão</option>
                    <option value="done">Concluído</option>

                </select>

                <label>Etiqueta</label>

                <select id="etiqueta">
                    <option>Frontend</option>
                    <option>Backend</option>
                    <option>Bug</option>
                    <option>Estudo</option>
                    <option>Cliente</option>
                </select>

                <div class="acoes-modal">

                    <button type="button" class="cancelar">

                        Cancelar

                    </button>

                    <button type="submit" class="salvar">

                        Criar tarefa

                    </button>

                </div>

            </form>

        </div>

    </div>

    <div id="lixeira" class="lixeira">

        <span>Solte aqui para excluir</span>

    </div>

    <!-- Toast -->

    <div id="toast" class="toast hidden">

        <span id="contadorToast">

            5

        </span>

        <span id="toastMensagem">

            Tarefa excluída.

        </span>

        <button id="btnDesfazer">

            Desfazer

        </button>

    </div>


    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
